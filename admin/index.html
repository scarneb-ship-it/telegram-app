<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель Hadron Verse</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="auth-container">
    <h1>Вход для администратора</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="signIn()">Войти</button>
    <p id="auth-error" style="color:red"></p>
  </div>

  <div id="admin-panel" style="display:none">
    <header>
      <h1>Админ-панель Hadron Verse</h1>
      <button onclick="signOut()">Выйти</button>
    </header>

    <nav>
      <button class="tab-button active" data-tab="stats">Статистика</button>
      <button class="tab-button" data-tab="broadcast">Рассылка</button>
    </nav>

    <main>
      <!-- Вкладка статистики -->
      <section id="stats-tab" class="tab-content active">
        <div class="stats-cards">
          <div class="card">
            <h3>Всего пользователей</h3>
            <p id="total-users">—</p>
          </div>
          <div class="card">
            <h3>Новых сегодня</h3>
            <p id="new-today">—</p>
          </div>
          <div class="card">
            <h3>Повторных сегодня</h3>
            <p id="return-today">—</p>
          </div>
        </div>
        <div style="max-width:800px; margin:auto;">
          <canvas id="visitsChart"></canvas>
        </div>
        <h2>Последние пользователи</h2>
        <table id="recent-users">
          <thead><tr><th>ID</th><th>Имя</th><th>Username</th><th>Дата регистрации</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Вкладка рассылки -->
      <section id="broadcast-tab" class="tab-content">
        <h2>Отправить рассылку</h2>
        <form id="broadcast-form">
          <label>Текст сообщения *</label>
          <textarea id="bc-text" required rows="4"></textarea>
          <label>URL фото (необязательно)</label>
          <input type="url" id="bc-photo" placeholder="https://...">
          <label>Текст кнопки (необязательно)</label>
          <input type="text" id="bc-button-text" placeholder="Например: Играть">
          <label>URL кнопки (необязательно)</label>
          <input type="url" id="bc-button-url" placeholder="https://...">
          <button type="submit">Отправить всем</button>
        </form>
        <div id="broadcast-result"></div>
        <h3>История рассылок</h3>
        <table id="broadcast-history">
          <thead><tr><th>ID</th><th>Дата</th><th>Текст</th><th>Отправлено</th><th>Статус</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
